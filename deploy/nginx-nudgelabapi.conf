# /etc/nginx/sites-available/nudgelabapi
#
# A third server block on the pingitapi / joynapi server, proxying to 127.0.0.1:8002 (SPEC §14.1).
#
# CONFIRM before enabling (deploy/preflight-check.sh checks most of these):
#   - DNS: nudgelabapi.myprimeportal.com points at this server (or its load balancer), like pingitapi.
#   - The wildcard certificate paths below are the ones pingitapi uses:
#       grep ssl_certificate /etc/nginx/sites-available/pingitapi
#   - The load-balancer subnet in set_real_ip_from (copied from pingitapi) is right for this server.

server {
    listen 80;
    server_name nudgelabapi.myprimeportal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nudgelabapi.myprimeportal.com;

    ssl_certificate     /etc/ssl/myprimeportal/star.myprimeportal.com.fullchain.crt;
    ssl_certificate_key /etc/ssl/myprimeportal/STAR_myprimeportal_com_key.txt;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/nudgelabapi-access.log;
    error_log  /var/log/nginx/nudgelabapi-error.log;

    # A JSON API: no pages of its own to frame or sniff (SPEC §12.8).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Real client IP behind the load balancer (same as pingitapi): the audit log records it.
    set_real_ip_from 10.0.0.0/16;
    real_ip_header X-Forwarded-For;

    # Requests are small JSON; no uploads in Stage 1.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CSV exports stream up to 100,000 rows; give them time.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
