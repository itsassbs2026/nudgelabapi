# /etc/nginx/sites-available/nudgelabapi
#
# Suncom Mobile's API, on suncom-nudgelab-web (100.59.145.97), proxying to 127.0.0.1:8002.
#
# CONFIRM before enabling (deploy/preflight-check.sh checks most of these):
#   - DNS: nudgelabapi.mysuncomportal.com points at this server (100.59.145.97).
#   - The certificate: sudo certbot certonly --nginx -d nudgelabapi.mysuncomportal.com gives the paths below.

server {
    listen 80;
    server_name nudgelabapi.mysuncomportal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nudgelabapi.mysuncomportal.com;

    ssl_certificate     /etc/letsencrypt/live/nudgelabapi.mysuncomportal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nudgelabapi.mysuncomportal.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/nudgelabapi-access.log;
    error_log  /var/log/nginx/nudgelabapi-error.log;

    # A JSON API: no pages of its own to frame or sniff (SPEC §12.8).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # No load balancer here: nginx sees the client's own address.

    # Requests are small JSON; no uploads in Stage 1.
    client_max_body_size 1m;

    # Topic images (2026-10-24) come to the API itself: up to 10 MB (MEDIA_MAX_UPLOAD_BYTES), so this one route
    # takes a little more. Without it nginx answers 413 with no CORS headers and the Studio only sees "failed".
    location ~ ^/api/v1/versions/[0-9]+/media$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CSV exports stream up to 100,000 rows; give them time.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
