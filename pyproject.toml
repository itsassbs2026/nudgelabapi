[project]
name = "nudgelabapi"
version = "0.1.0"
description = "NudgeLab dashboard API: reporting (Stage 1) and training management (Stage 2)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "scripts", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends(...)` in a parameter default is the framework's own idiom.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "app"
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[[tool.mypy.overrides]]
# No published type stubs (password-reset email through Microsoft Graph; the worker's scheduler).
module = ["msal.*", "apscheduler.*", "defusedxml.*"]
ignore_missing_imports = true
